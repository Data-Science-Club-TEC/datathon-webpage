name: Add Issue to Project

on:
  issues:
    types: [opened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Add to Project and Set Fields
        uses: actions/github-script@v7
        env:
          PROJECT_PAT: ${{ secrets.PROJECT_PAT }}
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const owner = 'Data-Science-Club-TEC';
            const projectNumber = 1;

            const pat = process.env.PROJECT_PAT;
            if (!pat) {
              core.setFailed('PROJECT_PAT secret is not set');
              return;
            }

            const client = github.graphql.defaults({
              headers: { authorization: `token ${pat}` }
            });

            // Detect frontend template
            const isFrontend = body.includes('TODO (Summary)') && body.includes('Scope of Work');

            // Parse sprint value
            const sprintMatch = body.match(/###\s*Target Sprint\s*\r?\n+([^\r\n]+)/i);
            let sprintValue = null;
            if (sprintMatch) {
              const val = sprintMatch[1].trim();
              if (val && !val.includes('_No response_')) {
                sprintValue = val;
              }
            }

            // Get project
            let project;
            try {
              const res = await client(`
                query($owner: String!, $number: Int!) {
                  organization(login: $owner) {
                    projectV2(number: $number) {
                      id
                      fields(first: 50) {
                        nodes {
                          ... on ProjectV2SingleSelectField {
                            id
                            name
                            options { id name }
                          }
                          ... on ProjectV2IterationField {
                            id
                            name
                            configuration {
                              iterations {
                                id
                                title
                                startDate
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `, { owner, number: projectNumber });
              project = res.organization.projectV2;
            } catch (err) {
              core.setFailed(`Failed to fetch project: ${err.message}`);
              return;
            }

            const projectId = project.id;
            const allFields = project.fields.nodes;

            // Add issue to project
            let itemId;
            try {
              const addRes = await client(`
                mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                    item { id }
                  }
                }
              `, { projectId, contentId: issue.node_id });
              itemId = addRes.addProjectV2ItemById.item.id;
              console.log(`Added issue #${issue.number} to project`);
            } catch (err) {
              core.setFailed(`Failed to add issue to project: ${err.message}`);
              return;
            }

            // Set Sprint (iteration field)
            if (sprintValue) {
              const sprintField = allFields.find(f => f.name === 'Sprint');
              if (sprintField && sprintField.configuration) {
                const iteration = sprintField.configuration.iterations.find(
                  i => i.title === sprintValue
                );
                if (iteration) {
                  try {
                    await client(`
                      mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $iterationId: ID!) {
                        updateProjectV2ItemFieldValue(input: {
                          projectId: $projectId
                          itemId: $itemId
                          fieldId: $fieldId
                          iterationId: $iterationId
                        }) {
                          projectV2Item { id }
                        }
                      }
                    `, { projectId, itemId, fieldId: sprintField.id, iterationId: iteration.id });
                    console.log(`Set Sprint to: ${sprintValue}`);
                  } catch (err) {
                    console.log(`Failed to set Sprint: ${err.message}`);
                  }
                } else {
                  console.log(`Sprint iteration "${sprintValue}" not found`);
                }
              }
            }

            // Set Area (single-select field) to Frontend if applicable
            if (isFrontend) {
              const areaField = allFields.find(f => f.name === 'Area');
              if (areaField) {
                const frontendOpt = areaField.options.find(o => o.name === 'Frontend');
                if (frontendOpt) {
                  try {
                    await client(`
                      mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: ID!) {
                        updateProjectV2ItemFieldValue(input: {
                          projectId: $projectId
                          itemId: $itemId
                          fieldId: $fieldId
                          singleSelectOptionId: $optionId
                        }) {
                          projectV2Item { id }
                        }
                      }
                    `, { projectId, itemId, fieldId: areaField.id, optionId: frontendOpt.id });
                    console.log('Set Area to: Frontend');
                  } catch (err) {
                    console.log(`Failed to set Area: ${err.message}`);
                  }
                }
              }
            }

      - name: Strip Target Sprint from Issue Body
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';

            const cleaned = body.replace(
              /###\s*Target Sprint\s*\r?\n[\s\S]*?(?=###\s|\z)/i,
              ''
            ).trim();

            if (cleaned !== body.trim()) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: cleaned
              });
              console.log('Stripped Target Sprint section');
            }
