name: Parse Issue Sprint & Type

on:
  issues:
    types: [opened, edited]

jobs:
  label-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Parse Sprint and Apply Labels
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';

            const labelsToAdd = ['feature'];

            // Extract Sprint option selected in the issue form (e.g., "Sprint 3")
            const sprintMatch = body.match(/###\s*Sprint\s*\r?\n+([^\r\n]+)/i);
            if (sprintMatch) {
              const sprintValue = sprintMatch[1].trim();
              if (sprintValue && !sprintValue.includes('_No response_')) {
                labelsToAdd.push(sprintValue);
              }
            }

            // Apply 'feature' + parsed 'Sprint X' label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: labelsToAdd
            });

            console.log(`Applied labels: ${labelsToAdd.join(', ')}`);