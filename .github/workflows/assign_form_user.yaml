name: Auto Assign and Project Setup
on:
  issues:
    types: [opened]

jobs:
  assign_and_project:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      repository-projects: write
    steps:
      - name: Add Issue to Project V2 & Apply Default Labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AUTO_ASSIGN_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const orgName = "Data-Science-Club-TEC";
            const projectNumber = 1;

            // 1. Optional: Apply TBD labels to repository issue
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: ['priority: tbd', 'effort: tbd']
            });

            // 2. Add Issue directly to Project V2
            const projectQuery = `
              query($org: String!, $number: Int!) {
                organization(login: $org) {
                  projectV2(number: $number) {
                    id
                  }
                }
              }
            `;

            try {
              const projectData = await github.graphql(projectQuery, { org: orgName, number: projectNumber });
              const projectId = projectData.organization.projectV2.id;

              const addItemMutation = `
                mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                    item { id }
                  }
                }
              `;
              await github.graphql(addItemMutation, {
                projectId: projectId,
                contentId: context.payload.issue.node_id
              });
            } catch (error) {
              console.error("Project V2 Update Error:", error);
            }