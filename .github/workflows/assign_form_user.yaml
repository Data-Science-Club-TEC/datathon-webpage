name: Add Issue to Project

on:
  issues:
    types: [opened, edited]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Debug PAT
        env:
          PROJECT_PAT: ${{ secrets.PROJECT_PAT }}
        run: |
          if [ -z "$PROJECT_PAT" ]; then
            echo "ERROR: PROJECT_PAT secret is empty or not set"
            exit 1
          fi
          echo "PAT length: ${#PROJECT_PAT}"
          echo "PAT prefix: ${PROJECT_PAT:0:4}..."

      - name: Add to Project and Set Fields
        uses: actions/github-script@v7
        env:
          PROJECT_PAT: ${{ secrets.PROJECT_PAT }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const owner = context.repo.owner;
            const configuredNumber = parseInt(process.env.PROJECT_NUMBER || '', 10);

            const pat = process.env.PROJECT_PAT;
            if (!pat) {
              core.setFailed('PROJECT_PAT secret is not set');
              return;
            }

            async function gql(query, variables = {}) {
              const res = await fetch('https://api.github.com/graphql', {
                method: 'POST',
                headers: {
                  'Authorization': `token ${pat}`,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({ query, variables })
              });
              const json = await res.json();
              if (json.errors) {
                throw new Error(json.errors.map(e => e.message).join('; '));
              }
              return json.data;
            }

            // Detect frontend template
            const isFrontend = body.includes('TODO (Summary)') && body.includes('Scope of Work');

            // Parse sprint value
            const sprintMatch = body.match(/###\s*Target Sprint\s*\r?\n+([^\r\n]+)/i);
            let sprintValue = null;
            if (sprintMatch) {
              const val = sprintMatch[1].trim();
              if (val && !val.includes('_No response_')) {
                sprintValue = val;
              }
            }

            // Discover the target project. The owner may be a user account or an org,
            // so try both, then fall back to whatever the token's own viewer can see.
            const slug = (s) => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
            const pickProject = (list) => {
              if (Number.isInteger(configuredNumber)) {
                return list.find(p => p.number === configuredNumber) || null;
              }
              const byTitle = list.find(p => slug(p.title) === slug(context.repo.repo));
              return byTitle || (list.length === 1 ? list[0] : null);
            };
            const summarize = (list) => list.map(p => `${p.number}:${p.title}`).join(', ') || '(none)';

            let project = null;

            try {
              const orgRes = await gql(`
                query($owner: String!) {
                  organization(login: $owner) {
                    projectsV2(first: 50) { nodes { id number title } }
                  }
                }
              `, { owner });
              const list = orgRes.organization && orgRes.organization.projectsV2.nodes;
              if (list) {
                console.log(`Org projects: ${summarize(list)}`);
                project = pickProject(list);
              }
            } catch (err) {
              console.log(`Org query failed: ${err.message}`);
            }

            if (!project) {
              try {
                const userRes = await gql(`
                  query($owner: String!) {
                    user(login: $owner) {
                      projectsV2(first: 50) { nodes { id number title } }
                    }
                  }
                `, { owner });
                const list = userRes.user && userRes.user.projectsV2.nodes;
                if (list) {
                  console.log(`User projects: ${summarize(list)}`);
                  project = pickProject(list);
                }
              } catch (err) {
                console.log(`User query failed: ${err.message}`);
              }
            }

            if (!project) {
              try {
                const viewerRes = await gql(`
                  query {
                    viewer { projectsV2(first: 50) { nodes { id number title } } }
                  }
                `);
                const list = viewerRes.viewer.projectsV2.nodes;
                console.log(`Viewer projects: ${summarize(list)}`);
                project = pickProject(list);
              } catch (err) {
                console.log(`Viewer query failed: ${err.message}`);
              }
            }

            if (!project) {
              core.setFailed(`Project ${owner}${Number.isInteger(configuredNumber) ? '/' + configuredNumber : ''} not found. Check PROJECT_PAT scopes (needs "project" scope), that the project is shared with the token owner, or set the PROJECT_NUMBER repository variable. Projects seen: check the logs above.`);
              return;
            }

            console.log(`Using project: ${project.title} (#${project.number})`);

            // Fetch full project with fields
            let allFields;
            try {
              const fullRes = await gql(`
                query($id: ID!) {
                  node(id: $id) {
                    ... on ProjectV2 {
                      id
                      fields(first: 50) {
                        nodes {
                          __typename
                          ... on ProjectV2SingleSelectField {
                            id
                            name
                            options { id name }
                          }
                          ... on ProjectV2IterationField {
                            id
                            name
                            configuration {
                              iterations {
                                id
                                title
                                startDate
                                duration
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `, { id: project.id });
              allFields = fullRes.node.fields.nodes;
            } catch (err) {
              core.setFailed(`Failed to fetch project fields: ${err.message}`);
              return;
            }

            const projectId = project.id;
            const fieldNames = allFields.filter(Boolean).map(f => `${f.__typename}(${f.name === undefined ? 'no-name' : f.name})`).join(', ');

            // Add issue to project
            let itemId;
            try {
              const addRes = await gql(`
                mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                    item { id }
                  }
                }
              `, { projectId, contentId: issue.node_id });
              itemId = addRes.addProjectV2ItemById.item.id;
              console.log(`Added issue #${issue.number} to project`);
            } catch (err) {
              core.setFailed(`Failed to add issue to project: ${err.message}`);
              return;
            }

            // Set Sprint (iteration field).
            // Priority: explicit form answer > the project's current iteration > next upcoming iteration.
            const sprintField = allFields.find(f => f && f.name === 'Sprint');

            const toTime = (d) => {
              if (!d) return NaN;
              return Date.parse(d.length === 10 ? `${d}T00:00:00Z` : d);
            };

            const pickCurrentIteration = (list) => {
              const now = Date.now();
              const day = 24 * 60 * 60 * 1000;
              const active = list.find(it => {
                const start = toTime(it && it.startDate);
                if (Number.isNaN(start)) return false;
                const end = start + ((it && it.duration) || 7) * day;
                return now >= start && now < end;
              });
              if (active) return { iteration: active, reason: 'active' };
              const upcoming = list.find(it => {
                const start = toTime(it && it.startDate);
                return !Number.isNaN(start) && start > now;
              });
              if (upcoming) return { iteration: upcoming, reason: 'next-upcoming' };
              return null;
            };

            if (!sprintField) {
              core.warning(`No "Sprint" field on project. Fields: ${fieldNames}`);
            } else if (!sprintField.configuration) {
              core.warning(`"Sprint" field is not an iteration field. Fields: ${fieldNames}`);
            } else {
              const iterations = sprintField.configuration.iterations || [];
              let iteration = null;
              let source = 'form';

              if (sprintValue) {
                iteration = iterations.find(i => i.title === sprintValue);
                if (!iteration) {
                  core.warning(`Sprint iteration "${sprintValue}" not found in project config. Available: ${iterations.map(i => i.title).join(', ')}`);
                }
              }

              if (!iteration) {
                const auto = pickCurrentIteration(iterations);
                if (auto) {
                  iteration = auto.iteration;
                  source = sprintValue ? `fallback:${auto.reason}` : `auto:${auto.reason}`;
                }
              }

              if (!iteration) {
                core.warning(`No usable sprint iteration. Form value=${JSON.stringify(sprintValue)}, available=${JSON.stringify(iterations.map(i => `${i.title}(${i.startDate}/${i.duration}d)`))}`);
              } else {
                console.log(`Sprint target: "${iteration.title}" (source=${source}, formValue=${JSON.stringify(sprintValue)}, startDate=${iteration.startDate}, duration=${iteration.duration})`);
                try {
                  const upd = await gql(`
                    mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $iterationId: String!) {
                      updateProjectV2ItemFieldValue(input: {
                        projectId: $projectId
                        itemId: $itemId
                        fieldId: $fieldId
                        value: { iterationId: $iterationId }
                      }) {
                        projectV2Item { id }
                      }
                    }
                  `, { projectId, itemId, fieldId: sprintField.id, iterationId: iteration.id });
                  console.log(`Mutation ok, item=${upd.updateProjectV2ItemFieldValue.projectV2Item.id}`);

                  const check = await gql(`
                    query($projectId: ID!, $itemId: ID!) {
                      node(id: $projectId) {
                        __typename
                        ... on ProjectV2 {
                          number
                          title
                          items(first: 100) {
                            totalCount
                            nodes {
                              id
                              content { __typename ... on Issue { number } ... on PullRequest { number } }
                              fieldValueByName(name: "Sprint") {
                                __typename
                                ... on ProjectV2ItemFieldIterationValue { title iterationId }
                              }
                            }
                          }
                        }
                      }
                      mine: node(id: $itemId) {
                        __typename
                        ... on ProjectV2Item {
                          fieldValueByName(name: "Sprint") {
                            __typename
                            ... on ProjectV2ItemFieldIterationValue { title iterationId }
                          }
                        }
                      }
                    }
                  `, { projectId, itemId });
                  const conn = check.node.items;
                  const all = conn.nodes;
                  const mine = check.mine;
                  console.log(`Read-back via itemId=${itemId} => ${JSON.stringify(mine)}`);
                  if (mine && mine.fieldValueByName && mine.fieldValueByName.iterationId === iteration.id) {
                    console.log(`Set Sprint to: ${iteration.title} (source=${source})`);
                  } else {
                    core.warning(`Sprint write did NOT persist (expected ${iteration.id}), got ${JSON.stringify(mine)}`);
                    console.log(`Project #${check.node.number} "${check.node.title}" items.totalCount=${conn.totalCount}`);
                    console.log(`Inventory: ${JSON.stringify(all.map(n => ({ id: n.id, content: n.content, sprint: n.fieldValueByName })))}`);
                  }
                } catch (err) {
                  core.warning(`Failed to set Sprint: ${err.message}`);
                }
              }
            }

            // Set Area (single-select field) to Frontend if applicable
            if (isFrontend) {
              const areaField = allFields.find(f => f && f.name === 'Area');
              if (!areaField) {
                core.warning(`No "Area" field on project. Fields: ${fieldNames}`);
              } else if (!areaField.options || areaField.options.length === 0) {
                core.warning(`"Area" field has no options - add a "Frontend" option to the project's Area field. Fields: ${fieldNames}`);
              } else {
                const frontendOpt = areaField.options.find(o => o.name === 'Frontend');
                if (!frontendOpt) {
                  core.warning(`Area option "Frontend" not found. Available: ${areaField.options.map(o => o.name).join(', ')}`);
                } else {
                  try {
                    await gql(`
                      mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                        updateProjectV2ItemFieldValue(input: {
                          projectId: $projectId
                          itemId: $itemId
                          fieldId: $fieldId
                          value: { singleSelectOptionId: $optionId }
                        }) {
                          projectV2Item { id }
                        }
                      }
                    `, { projectId, itemId, fieldId: areaField.id, optionId: frontendOpt.id });
                    console.log('Set Area to: Frontend');
                  } catch (err) {
                    core.warning(`Failed to set Area: ${err.message}`);
                  }
                }
              }
            }

  strip-target-sprint:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Strip Target Sprint from Issue Body
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';

            const lines = body.split(/\r?\n/);
            const start = lines.findIndex(l => /^###\s*Target Sprint\s*$/i.test(l.trim()));

            if (start === -1) {
              console.log('No "### Target Sprint" section found - nothing to strip');
              return;
            }

            let end = start + 1;
            while (end < lines.length && !/^###\s/.test(lines[end].trim())) {
              end++;
            }

            const cleaned = [
              ...lines.slice(0, start),
              ...lines.slice(end)
            ].join('\n')
              .replace(/[ \t]+$/gm, '')
              .replace(/\n{3,}/g, '\n\n')
              .trim();

            if (cleaned === body.trim()) {
              console.log('Body unchanged after stripping - skipping update');
              return;
            }

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: cleaned
            });
            console.log(`Stripped Target Sprint section (lines ${start + 1}-${end})`);
