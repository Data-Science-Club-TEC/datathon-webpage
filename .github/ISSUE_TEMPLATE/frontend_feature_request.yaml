name: Frontend feature request
description: Request a new feature in Frontend.
title: "[FEATURE] "
type: feature
projects: ["[COPY] Datathon-webpage/3]
body:
  - type: textarea
    id: todo_summary
    attributes:
      label: TODO (Summary)
      description: A 50 to 150 word synthesis on what needs to be done.
      placeholder: Write a concise synthesis of the task...
    validations:
      required: true

  - type: textarea
    id: scope_of_work
    attributes:
      label: Scope of Work
      description: Detailed explanation of the feature and requirements.
      placeholder: Provide full technical details, acceptance criteria, and user stories...
    validations:
      required: true

  - type: dropdown
    id: sprint
    attributes:
      label: Target Sprint
      description: Select target sprint.
      options:
        - Sprint 3
        - Sprint 4
        - Sprint 5
        - Sprint 6
    validations:
      required: true